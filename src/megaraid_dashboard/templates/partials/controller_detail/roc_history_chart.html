<section class="section" data-controller-section="roc-history" aria-labelledby="roc-history-heading">
  <div class="chart-section" data-roc-history-url="{{ view_model.roc_history_chart_url }}">
    <div class="section-heading">
      <h2 id="roc-history-heading">RoC Temperature History</h2>
      <div class="range-tabs" role="tablist" aria-label="RoC history range">
        <button type="button" class="range-tabs__button" data-range-hours="1" role="tab" aria-selected="false">1h</button>
        <button type="button" class="range-tabs__button range-tabs__button--active" data-range-hours="24" role="tab" aria-selected="true">24h</button>
        <button type="button" class="range-tabs__button" data-range-hours="168" role="tab" aria-selected="false">7d</button>
        <button type="button" class="range-tabs__button" data-range-hours="720" role="tab" aria-selected="false">30d</button>
      </div>
    </div>
    <div class="card chart-card">
    <canvas id="roc-history-chart" class="chart-canvas-v2"></canvas>
    <p class="chart-empty" data-roc-chart-empty hidden>No RoC temperature samples in this range.</p>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const card = document.querySelector("[data-roc-history-url]");
      const canvas = document.getElementById("roc-history-chart");
      if (!card || !canvas || !window.Chart) {
        return;
      }

      let chart = null;
      const emptyState = card.querySelector("[data-roc-chart-empty]");
      function setActiveRange(rangeHours) {
        card.querySelectorAll("[data-range-hours]").forEach((button) => {
          const active = button.dataset.rangeHours === String(rangeHours);
          button.classList.toggle("range-tabs__button--active", active);
          button.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function render(payload, rangeHours) {
        const theme = window.chartTheme.palette();
        const points = payload.points || [];
        const labels = points.map((point) => point.captured_at);
        const values = points.map((point) => point.temperature_celsius);
        if (chart) {
          chart.destroy();
        }
        if (emptyState) {
          emptyState.hidden = points.length > 0;
        }
        chart = new window.Chart(canvas, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "RoC °C",
              data: values,
              borderColor: theme.accent,
              backgroundColor: theme.fill,
              pointRadius: 2,
              tension: 0.22,
            }],
          },
          plugins: [window.chartTheme.thresholdPlugin],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: window.localTime.chartTooltip(labels),
              temperatureThresholds: window.chartTheme.thresholds(payload.warning_threshold, payload.critical_threshold),
            },
            scales: {
              x: window.localTime.chartAxis(labels, rangeHours),
              y: {
                suggestedMin: payload.min_celsius,
                suggestedMax: payload.critical_threshold,
                ticks: { color: theme.muted },
                grid: { color: theme.grid },
              },
            },
          },
        });
        setActiveRange(rangeHours);
      }

      function fetchRange(rangeHours) {
        const url = new URL(card.dataset.rocHistoryUrl, window.location.origin);
        url.searchParams.set("range_hours", rangeHours);
        fetch(url, { headers: { Accept: "application/json" } })
          .then((response) => response.json())
          .then((payload) => render(payload, rangeHours));
      }

      card.querySelectorAll("[data-range-hours]").forEach((button) => {
        button.addEventListener("click", function () {
          fetchRange(button.dataset.rangeHours);
        });
      });
      fetchRange(24);
    });
  </script>
</section>
